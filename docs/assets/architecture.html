<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Referee architecture</title>
<style>
  html, body { margin: 0; padding: 0; background: #F4F6FB; }
  body { width: 1600px; height: 900px; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="arch" width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/>
    </marker>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#F4F6FB"/>

  <!-- Header -->
  <text x="40" y="52" fill="#64748B" font-size="13" font-weight="600" letter-spacing="2.2">WHACK-26 · BREVAN HOWARD TRACK</text>
  <text x="40" y="96" fill="#0F172A" font-size="40" font-weight="700" letter-spacing="-0.5">Referee</text>
  <text x="214" y="96" fill="#94A3B8" font-size="22" font-weight="400">/ dataset to validated hypothesis</text>
  <text x="40" y="122" fill="#475569" font-size="16">Turns a tabular dataset into cited research, three runnable models, a four-layer validation report, and an advisory final judge.</text>

  <g transform="translate(1140, 44)">
    <circle cx="0" cy="8" r="6" fill="#2563EB"/>
    <text x="16" y="13" fill="#475569" font-size="13" font-weight="600">Generation</text>
    <circle cx="132" cy="8" r="6" fill="#D97706"/>
    <text x="148" y="13" fill="#475569" font-size="13" font-weight="600">Method critique</text>
    <circle cx="292" cy="8" r="6" fill="#059669"/>
    <text x="308" y="13" fill="#475569" font-size="13" font-weight="600">Statistical validation</text>
    <text x="0" y="38" fill="#94A3B8" font-size="12">generation, critique, and validation are separate stages</text>
  </g>

  <!-- LAYER 1 -->
  <rect x="40" y="140" width="1520" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#soft)"/>
  <rect x="40" y="140" width="1520" height="6" rx="3" fill="#2563EB"/>
  <text x="64" y="176" fill="#1D4ED8" font-size="14" font-weight="700" letter-spacing="1.6">LAYER 1 · GENERATION</text>
  <text x="280" y="176" fill="#64748B" font-size="13">reads the dataset and the research, writes runnable models</text>

  <g filter="url(#soft)">
    <rect x="64" y="200" width="268" height="160" rx="12" fill="#F8FAFF" stroke="#DBEAFE"/>
    <rect x="364" y="200" width="268" height="160" rx="12" fill="#F8FAFF" stroke="#DBEAFE"/>
    <rect x="664" y="200" width="268" height="160" rx="12" fill="#F8FAFF" stroke="#DBEAFE"/>
    <rect x="964" y="200" width="268" height="160" rx="12" fill="#F8FAFF" stroke="#DBEAFE"/>
    <rect x="1264" y="200" width="268" height="160" rx="12" fill="#F8FAFF" stroke="#DBEAFE"/>
  </g>

  <g>
    <circle cx="88" cy="224" r="12" fill="#2563EB"/><text x="88" y="229" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="110" y="229" fill="#0F172A" font-size="15" font-weight="700">Dataset</text>
    <text x="82" y="258" fill="#475569" font-size="12.5">CSV · TSV · Excel</text>
    <text x="82" y="278" fill="#475569" font-size="12.5">JSON · Parquet</text>
    <text x="82" y="298" fill="#64748B" font-size="12">optional description</text>

    <circle cx="388" cy="224" r="12" fill="#2563EB"/><text x="388" y="229" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="410" y="229" fill="#0F172A" font-size="15" font-weight="700">Profile &amp; classify</text>
    <text x="382" y="258" fill="#475569" font-size="12.5">schema, dtypes, missingness</text>
    <text x="382" y="278" fill="#475569" font-size="12.5">field hierarchy built from data</text>
    <text x="382" y="298" fill="#64748B" font-size="12">vector embeddings</text>

    <circle cx="688" cy="224" r="12" fill="#2563EB"/><text x="688" y="229" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="710" y="229" fill="#0F172A" font-size="15" font-weight="700">Research</text>
    <text x="682" y="258" fill="#475569" font-size="12.5">OpenAlex · arXiv · HF · Zenodo</text>
    <text x="682" y="278" fill="#475569" font-size="12.5">Wikipedia + 7 optional adapters</text>
    <text x="682" y="298" fill="#64748B" font-size="12">cache · dedupe · rank</text>

    <circle cx="988" cy="224" r="12" fill="#2563EB"/><text x="988" y="229" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="1010" y="229" fill="#0F172A" font-size="15" font-weight="700">Factor extraction</text>
    <text x="982" y="258" fill="#475569" font-size="12.5">each needs an evidence ID</text>
    <text x="982" y="278" fill="#475569" font-size="12.5">mapped by name + embedding</text>
    <text x="982" y="298" fill="#64748B" font-size="12">context-only flagged</text>

    <circle cx="1288" cy="224" r="12" fill="#2563EB"/><text x="1288" y="229" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text x="1310" y="229" fill="#0F172A" font-size="15" font-weight="700">Hypotheses</text>
    <text x="1282" y="258" fill="#475569" font-size="12.5">one per method family</text>
    <text x="1282" y="278" fill="#475569" font-size="12.5">AST-checked, run in a subprocess</text>
    <text x="1282" y="298" fill="#64748B" font-size="12">predictions saved per row</text>
  </g>

  <g stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow-blue)">
    <line x1="334" y1="280" x2="360" y2="280"/>
    <line x1="634" y1="280" x2="660" y2="280"/>
    <line x1="934" y1="280" x2="960" y2="280"/>
    <line x1="1234" y1="280" x2="1260" y2="280"/>
  </g>

  <!-- LAYER 2 -->
  <rect x="40" y="430" width="1520" height="140" rx="16" fill="#FFFCF5" stroke="#FDE68A" stroke-width="1.5" filter="url(#soft)"/>
  <rect x="40" y="430" width="1520" height="6" rx="3" fill="#D97706"/>
  <text x="64" y="466" fill="#B45309" font-size="14" font-weight="700" letter-spacing="1.6">LAYER 2 · METHOD CRITIQUE</text>
  <text x="300" y="466" fill="#64748B" font-size="13">checks the derivation against the pitfalls corpus</text>

  <g filter="url(#soft)">
    <rect x="64" y="486" width="600" height="68" rx="12" fill="#FFFFFF" stroke="#FDE68A"/>
    <rect x="696" y="486" width="420" height="68" rx="12" fill="#FFFFFF" stroke="#FDE68A"/>
    <rect x="1148" y="486" width="388" height="68" rx="12" fill="#FFFFFF" stroke="#FDE68A"/>
  </g>
  <text x="84" y="510" fill="#0F172A" font-size="14" font-weight="700">Method critic</text>
  <text x="84" y="532" fill="#475569" font-size="12">claim type · leakage · multiplicity · sample size · missing data · time series</text>
  <text x="716" y="510" fill="#0F172A" font-size="14" font-weight="700">Deterministic checks first</text>
  <text x="716" y="532" fill="#475569" font-size="12">target-as-feature · preprocessing before split · future data</text>
  <text x="1168" y="510" fill="#0F172A" font-size="14" font-weight="700">13-section pitfalls corpus</text>
  <text x="1168" y="532" fill="#475569" font-size="12">v1.0.1 · one citation per finding</text>

  <!-- LAYER 3 -->
  <rect x="40" y="600" width="1520" height="140" rx="16" fill="#F3FDF8" stroke="#BBF7D0" stroke-width="1.5" filter="url(#soft)"/>
  <rect x="40" y="600" width="1520" height="6" rx="3" fill="#059669"/>
  <text x="64" y="636" fill="#047857" font-size="14" font-weight="700" letter-spacing="1.6">LAYER 3 · STATISTICAL VALIDATION</text>
  <text x="352" y="636" fill="#64748B" font-size="13">runs four tests on the fitted model</text>

  <g filter="url(#soft)">
    <rect x="64" y="656" width="340" height="62" rx="12" fill="#FFFFFF" stroke="#BBF7D0"/>
    <rect x="424" y="656" width="340" height="62" rx="12" fill="#FFFFFF" stroke="#BBF7D0"/>
    <rect x="784" y="656" width="340" height="62" rx="12" fill="#FFFFFF" stroke="#BBF7D0"/>
    <rect x="1144" y="656" width="340" height="62" rx="12" fill="#FFFFFF" stroke="#BBF7D0"/>
  </g>
  <text x="84" y="680" fill="#0F172A" font-size="14" font-weight="700">Deflated Sharpe Ratio</text>
  <text x="84" y="700" fill="#475569" font-size="12">multiple-testing correction</text>
  <text x="444" y="680" fill="#0F172A" font-size="14" font-weight="700">Monte Carlo permutation</text>
  <text x="444" y="700" fill="#475569" font-size="12">compare against shuffled labels</text>
  <text x="804" y="680" fill="#0F172A" font-size="14" font-weight="700">Chronological OOS decay</text>
  <text x="804" y="700" fill="#475569" font-size="12">train on past, test on future</text>
  <text x="1164" y="680" fill="#0F172A" font-size="14" font-weight="700">Parameter sensitivity</text>
  <text x="1164" y="700" fill="#475569" font-size="12">perturb hyperparameters ±10%</text>
  <text x="64" y="734" fill="#047857" font-size="11.5" font-weight="600">verdict vocabulary:  pass · refine · reject · insufficient</text>

  <!-- connectors -->
  <g stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-dark)">
    <line x1="800" y1="400" x2="800" y2="426"/>
    <line x1="800" y1="570" x2="800" y2="596"/>
    <line x1="800" y1="740" x2="800" y2="766"/>
  </g>
  <text x="814" y="421" fill="#64748B" font-size="11">proposed models</text>
  <text x="814" y="591" fill="#64748B" font-size="11">audited derivations</text>
  <text x="814" y="761" fill="#64748B" font-size="11">versioned handoff</text>

  <!-- OUTPUT -->
  <rect x="40" y="770" width="1520" height="90" rx="16" fill="#0F172A" filter="url(#soft)"/>
  <text x="64" y="810" fill="#FFFFFF" font-size="20" font-weight="700">Artifact</text>
  <text x="64" y="834" fill="#CBD5E1" font-size="13">artifact.json  ·  preview.md  ·  validation.json  ·  final_judge.fragment.html</text>
  <text x="1536" y="812" fill="#E2E8F0" font-size="13.5" text-anchor="end">evidence IDs on factors · code hashes on hypotheses · corpus citations on findings</text>
  <text x="1536" y="834" fill="#94A3B8" font-size="12" text-anchor="end">1,476 tests passing · two live datasets · corpus v1.0.1</text>

  <text x="40" y="886" fill="#94A3B8" font-size="11">IDs and hashes are content-derived where possible. Artifacts contain no keys or absolute paths.</text>
</svg>
</body>
</html>
